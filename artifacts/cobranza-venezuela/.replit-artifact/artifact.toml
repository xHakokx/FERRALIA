kind = "web"
previewPath = "/"
title = "FERRALIA · Cobranza Venezuela"
description = "FERRALIA — ECCELLENZA INDUSTRIALE: aplicación móvil web para ventas a crédito y cobranza en Venezuela, con pagos multimoneda, tasa BCV y contratos digitales."
version = "1.0.0"
id = "artifacts/cobranza-venezuela"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22706

[services.development]
run = "pnpm --filter @workspace/cobranza-venezuela run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cobranza-venezuela", "run", "build" ]
serve = "static"
publicDir = "artifacts/cobranza-venezuela/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22706"
BASE_PATH = "/"
